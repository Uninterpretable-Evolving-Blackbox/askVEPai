# Runs the deterministic suites on every push and pull request.
#
# WHY. Every figure in this repository is supposed to be reproducible by a command, and several
# harnesses exist purely to fail when a published number stops matching the code. Until now nothing
# ran them except a person remembering to. On 2026-08-19 a change invalidated two published figures
# and the harness caught it — but only because someone happened to run it.
#
# No dependencies are installed on purpose. The three suites need the standard library alone: they
# import vep_assistant to read the priority table, and the openai SDK is imported lazily inside main()
# so a model-free harness never pulls it in. If this job ever starts needing a pip install, something
# has grown a runtime dependency it should not have.
#
# vep_ai_demo is an ordinary folder in this repository (2026-09-23; it was a submodule before).

name: suites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # 3.9 also runs every suite (tested on 3.9.6)

      - name: Confirm no third-party package is needed
        run: pip list --format=freeze

      - name: verify_pipeline — the deterministic pipeline invariants (79 as of 2026-09-23)
        run: python tests/verify_pipeline.py

      - name: test_user_context — 15 checks that a stated fact beats the classifier
        run: python tests/test_user_context.py

      - name: defaults_evidence — 28 checks that every guessed value still matches its evidence
        run: python tests/defaults_evidence.py

      - name: engine_regressions — the 2026-09-27 audit's engine defects stay fixed
        run: python tests/engine_regressions.py

      - name: ask_rate — reproduce the shipped interrupt rate
        run: |
          python tests/ask_rate.py | tee /tmp/ask.txt
          grep -qE '^  shipped +12 +12/78' /tmp/ask.txt || {
            echo "::error::ask rate no longer matches the shipped figure (12 questions over 12 of 78, all analysis_goal; 2026-09-23)"
            exit 1
          }
